      animation: pulseDot 1.6s infinite ease-in-out;

    function getTodayDateString() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function addDaysToDateString(dateStr, days) {
      const base = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
      base.setDate(base.getDate() + days);
      const y = base.getFullYear();
      const m = String(base.getMonth() + 1).padStart(2, '0');
      const d = String(base.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatReadableDate(dateStr) {
      if (!dateStr) return 'Not set';
      try {
        const [y, m, d] = dateStr.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      } catch (e) {
        return dateStr;
      }
    }

    // Safe v1 -> v2 Data Migration & Normalization
    function normalizeSyllabusData(rawSyllabus) {
      if (!Array.isArray(rawSyllabus)) return JSON.parse(JSON.stringify(INITIAL_SYLLABUS));

      const rawSubjectMap = new Map(rawSyllabus.map(s => [s.id || (s.name && s.name.toLowerCase()), s]));

      return INITIAL_SYLLABUS.map(initSubject => {
        const existingSubject = rawSubjectMap.get(initSubject.id) || rawSyllabus.find(s => s && s.name === initSubject.name);
        if (!existingSubject || !Array.isArray(existingSubject.topics)) {
          return JSON.parse(JSON.stringify(initSubject));
        }

        const existingTopicMap = new Map(existingSubject.topics.filter(Boolean).map(t => [t.id, t]));

        const mergedTopics = initSubject.topics.map(initTopic => {
          const savedTopic = existingTopicMap.get(initTopic.id);
          if (!savedTopic) return { ...initTopic, subtopics: [] };

          return {
            ...initTopic,
            ...savedTopic,
            status: WEIGHTS[savedTopic.status] !== undefined ? savedTopic.status : initTopic.status,
            notes: typeof savedTopic.notes === 'string' ? savedTopic.notes : '',
            subtopics: Array.isArray(savedTopic.subtopics)
              ? savedTopic.subtopics.map(st => ({
                  id: st.id || `st-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
                  name: String(st.name || 'Untitled Subtopic'),
                  completed: Boolean(st.completed),
                  notes: typeof st.notes === 'string' ? st.notes : ''
                }))
              : [],
            nextRevisionDate: savedTopic.nextRevisionDate || null,
            lastRevisionDate: savedTopic.lastRevisionDate || null
          };
        });

        const initTopicIds = new Set(initSubject.topics.map(t => t.id));
        const customTopics = existingSubject.topics
          .filter(t => t && t.id && !initTopicIds.has(t.id))
          .map(t => ({
            id: t.id,
            unit: t.unit || 'Custom',
            name: t.name || 'Custom Topic',
            status: WEIGHTS[t.status] !== undefined ? t.status : 'Not Started',
            notes: typeof t.notes === 'string' ? t.notes : '',
            subtopics: Array.isArray(t.subtopics) ? t.subtopics : [],
            nextRevisionDate: t.nextRevisionDate || null,
            lastRevisionDate: t.lastRevisionDate || null
          }));

        return {
          ...initSubject,
          topics: [...mergedTopics, ...customTopics]
        };
      });
    }

    function getTopicProgress(topic) {
      if (Array.isArray(topic.subtopics) && topic.subtopics.length > 0) {
        const completedCount = topic.subtopics.filter(st => st.completed).length;
        return Math.round((completedCount / topic.subtopics.length) * 100);
      }
      return WEIGHTS[topic.status] ?? 0;
    }

    function getSubjectProgress(subject) {
      if (!subject || !Array.isArray(subject.topics) || subject.topics.length === 0) return 0;
      const totalWeight = subject.topics.length * 100;
      const currentWeight = subject.topics.reduce((acc, t) => acc + getTopicProgress(t), 0);
      return Math.round((currentWeight / totalWeight) * 100);
    }

    function getOverallProgress(syllabus) {
      const allTopics = syllabus.flatMap(s => s.topics);
      if (allTopics.length === 0) return 0;
      const totalWeight = allTopics.length * 100;
      const currentWeight = allTopics.reduce((acc, t) => acc + getTopicProgress(t), 0);
      return Math.round((currentWeight / totalWeight) * 100);
    }

    // 100% Offline Web Audio API Chime Generator
    function playOfflineNotificationSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const freqs = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        freqs.forEach((f, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + idx * 0.14);
          gain.gain.setValueAtTime(0.001, now + idx * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.24, now + idx * 0.14 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.14 + 0.65);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.14);
          osc.stop(now + idx * 0.14 + 0.7);
        });
      } catch (err) {
        console.warn('Web Audio API chime skipped:', err);
      }
    }

    /* ==========================================================================
       4. PERSISTENT APPLICATION STATE (LOCALSTORAGE KEYS STRICTLY PRESERVED)

    const STORAGE_KEYS = {

      TASKS: '11th-syllabus-tasks-v2',
      SESSIONS: '11th-syllabus-sessions-v2'
    };

    function loadStoredJSON(key, fallback, normalizer = null) {
      try {
        const raw = window.localStorage.getItem(key);
        if (raw !== null) {
          const parsed = JSON.parse(raw);
          return normalizer ? normalizer(parsed) : parsed;
        }
      } catch (err) {
        console.error('Error loading key ' + key, err);
      }
      return normalizer ? normalizer(fallback) : fallback;
    }

    function saveStoredJSON(key, data) {
      try {
        window.localStorage.setItem(key, JSON.stringify(data));
      } catch (err) {
        console.error('Error writing key ' + key, err);
      }
    }

    function persistAll() {

      saveStoredJSON(STORAGE_KEYS.SESSIONS, state.sessions);

    function findTopicById(topicId) {
      for (const subj of state.syllabus) {
        const found = subj.topics.find(t => t.id === topicId);
        if (found) return { subject: subj, topic: found };
      }
      return null;
    }

    function updateTopicById(topicId, updates, shouldRender = true) {
      state.syllabus = state.syllabus.map(subj => ({
        ...subj,
        topics: subj.topics.map(t => t.id === topicId ? { ...t, ...updates } : t)
      }));
      saveStoredJSON(STORAGE_KEYS.SYLLABUS, state.syllabus);
      if (shouldRender) renderApp();
    }

    /* ==========================================================================
       5. POMODORO BACKGROUND-ACCURATE TIMER ENGINE
       ========================================================================== */
    setInterval(() => {
      const p = state.pomodoro;
      if (!p.isActive || !p.targetEndTime) return;

      const remainingMs = p.targetEndTime - Date.now();
      const remainingSec = Math.max(0, Math.ceil(remainingMs / 1000));
      p.timeLeft = remainingSec;

      if (remainingSec <= 0) {
        p.targetEndTime = null;
        p.isActive = false;

        if (p.soundEnabled) {
          playOfflineNotificationSound();
        }

        if (!p.isBreak) {
          const durationMinutes = Math.round(p.sessionStartDuration / 60);
          const subj = state.syllabus.find(s => s.id === p.selectedSubjectId) || state.syllabus[0];
          const newSession = {
            id: `sess-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            subjectId: subj.id,
            subjectName: subj.name,
            durationMinutes,
            timestamp: new Date().toISOString(),
            date: getTodayDateString()
          };
          state.sessions = [newSession, ...state.sessions];
          saveStoredJSON(STORAGE_KEYS.SESSIONS, state.sessions);

          p.bannerMessage = `+${durationMinutes}m logged for ${subj.name}!`;
          setTimeout(() => {
            state.pomodoro.bannerMessage = null;
            renderPomodoroWidgetOnly();
          }, 5000);

          p.isBreak = true;
          p.timeLeft = 5 * 60;
          p.sessionStartDuration = 5 * 60;
        } else {
          p.isBreak = false;
          p.timeLeft = 25 * 60;
          p.sessionStartDuration = 25 * 60;
        }
        renderApp();
      } else {
        updatePomodoroClockDOM();
      }
    }, 250);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && state.pomodoro.isActive && state.pomodoro.targetEndTime) {
        const remainingSec = Math.max(0, Math.ceil((state.pomodoro.targetEndTime - Date.now()) / 1000));
        state.pomodoro.timeLeft = remainingSec;
        updatePomodoroClockDOM();
      }
    });

      const mins = Math.floor(state.pomodoro.timeLeft / 60).toString().padStart(2, '0');

      clockEl.textContent = `${mins}:${secs}`;

                <button type="button" data-action="start-task-edit" data-task-id="${task.id}" class="btn-icon" style="padding:0.35rem; border:none;" title="Edit Task">
                  ${icon('Edit3', 15)}

                  ${icon('Trash2', 15)}

              </div>

    function buildRevisionsViewHTML() {
      const todayStr = getTodayDateString();
      const allTopics = state.syllabus.flatMap(s => s.topics.map(t => ({ ...t, subjectName: s.name })));

      const overdue = allTopics.filter(t => t.nextRevisionDate && t.nextRevisionDate < todayStr).sort((a, b) => a.nextRevisionDate.localeCompare(b.nextRevisionDate));
      const dueToday = allTopics.filter(t => t.nextRevisionDate && t.nextRevisionDate === todayStr);
      const flaggedStatus = allTopics.filter(t => t.status === 'Needs Revision' && (!t.nextRevisionDate || t.nextRevisionDate > todayStr));
      const upcoming = allTopics.filter(t => t.nextRevisionDate && t.nextRevisionDate > todayStr).sort((a, b) => a.nextRevisionDate.localeCompare(b.nextRevisionDate));

      const renderRevItem = (t, badgeHtml) => `

            <div class="flex flex-wrap items-center gap-2 mb-1">
              <span class="badge badge-unit">${escapeHtml(t.subjectName)} • ${escapeHtml(t.unit)}</span>

            <h4 class="text-base font-semibold text-white">${escapeHtml(t.name)}</h4>
            <div class="text-xs text-slate-400 mt-1">
              Status: <strong class="text-slate-200">${escapeHtml(t.status)}</strong>
              &nbsp;•&nbsp; Last Revised: <strong class="text-slate-200">${formatReadableDate(t.lastRevisionDate)}</strong>
              &nbsp;•&nbsp; Scheduled: <strong class="text-slate-200">${formatReadableDate(t.nextRevisionDate)}</strong>
            </div>

          <div class="flex flex-wrap items-center gap-2">
            <button type="button" data-action="mark-revised" data-topic-id="${t.id}" data-days="7" class="btn btn-success">
              ${icon('Check', 14)} <span>Revised (+7d)</span>

            <button type="button" data-action="mark-revised" data-topic-id="${t.id}" data-days="14" class="btn btn-secondary">+14d</button>
            <input type="date" value="${t.nextRevisionDate || ''}" data-action="set-revision-date" data-topic-id="${t.id}" class="input" style="width:auto; padding:0.35rem 0.55rem; font-size:0.75rem;" />

        </div>
      `;

      return `

            <h1 class="text-3xl font-bold text-white mb-1">Smart Revision System</h1>
            <p class="text-sm text-slate-400">Track overdue chapter reviews, complete today's revisions, and schedule spaced repetition.</p>

            <div class="card" style="border-color:rgba(239,68,68,0.25);">

    function buildAnalyticsViewHTML() {
      const todayStr = getTodayDateString();
      const allTopics = state.syllabus.flatMap(s => s.topics);
      const completedChapters = allTopics.filter(t => getTopicProgress(t) === 100 || t.status === 'Completed').length;
      const revRequired = allTopics.filter(t => t.status === 'Needs Revision' || (t.nextRevisionDate && t.nextRevisionDate <= todayStr)).length;
      const overall = getOverallProgress(state.syllabus);

      const totalStudyMins = state.sessions.reduce((acc, s) => acc + (Number(s.durationMinutes) || 0), 0);
      const totalStudyHours = (totalStudyMins / 60).toFixed(1);

      // Last 7 days bar chart data
      const days7 = [];
      for (let i = 6; i >= 0; i--) {
        const dStr = addDaysToDateString(todayStr, -i);
        const mins = state.sessions.filter(s => s.date === dStr).reduce((acc, s) => acc + (Number(s.durationMinutes) || 0), 0);
        const [, m, d] = dStr.split('-');
        days7.push({ dStr, label: `${d}/${m}`, mins });
      }
      const weeklyMins = days7.reduce((acc, d) => acc + d.mins, 0);
      const maxDayMins = Math.max(60, ...days7.map(d => d.mins));

      // Subject study breakdown
      const subjHours = state.syllabus.map(s => {

          .filter(sess => sess.subjectId === s.id || sess.subjectName === s.name)
          .reduce((acc, sess) => acc + (Number(sess.durationMinutes) || 0), 0);
        return { id: s.id, name: s.name, mins, hours: (mins / 60).toFixed(1) };
      });
      const maxSubjMins = Math.max(60, ...subjHours.map(s => s.mins));

      const totalTasks = state.tasks.length;
      const doneTasks = state.tasks.filter(t => t.completed).length;

            <div class="card">

            <!-- Last 7 Days Bar Chart -->

          <div class="grid-2">

                <span class="text-indigo-400">${icon('Award', 16)}</span> <span>Subject-wise Study Hours</span>

              <div class="space-y-3">
                ${subjHours.map(item => {
                  const pct = Math.round((item.mins / maxSubjMins) * 100);
                  return `
                    <div>
                      <div class="flex justify-between text-xs mb-1">
                        <span class="font-medium text-slate-200">${escapeHtml(item.name)}</span>
                        <span class="text-slate-400">${item.hours} hrs (${item.mins} mins)</span>
                      </div>
                      <div class="progress-track" style="height:7px;">

                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Log Manual Study Session -->
            <div class="card space-y-4">
              <div>
                <h3 class="text-base font-semibold text-white flex items-center gap-2 mb-1">
                  <span class="text-indigo-400">${icon('History', 16)}</span> <span>Log Offline Study Session</span>

                  <div class="space-y-1">
                    ${state.sessions.slice(0, 4).map(sess => `
                      <div class="flex justify-between text-xs" style="background:var(--bg-950); padding:0.35rem 0.6rem; border-radius:0.35rem; border:1px solid var(--border-800);">

          </div>
        </div>
      `;

    function renderApp() {
      const todayStr = getTodayDateString();
      const dueRevisionsCount = state.syllabus
        .flatMap(s => s.topics)
        .filter(t => (t.nextRevisionDate && t.nextRevisionDate <= todayStr) || t.status === 'Needs Revision')
        .length;
      const todayPendingTasksCount = state.tasks.filter(t => t.targetDate === todayStr && !t.completed).length;

      // Determine main view content
      let mainContentHTML = '';
      const q = state.searchQuery.trim().toLowerCase();

      if (q !== '') {
        const results = state.syllabus.flatMap(s =>
          s.topics
            .filter(t => {
              const matchTopic =
                t.name.toLowerCase().includes(q) ||
                t.unit.toLowerCase().includes(q) ||
                (t.notes && t.notes.toLowerCase().includes(q));
              const matchSub =
                Array.isArray(t.subtopics) &&
                t.subtopics.some(st => st.name.toLowerCase().includes(q) || (st.notes && st.notes.toLowerCase().includes(q)));
              return matchTopic || matchSub;

            .map(t => ({ topic: t, subjectName: s.name }))
        );

            <div>

              ? `<div class="space-y-3">${results.map(r => buildTopicCardHTML(r.topic, r.subjectName)).join('')}</div>`

                ${todayPendingTasksCount > 0 ? `<span class="badge badge-unit">${todayPendingTasksCount}</span>` : ''}
              </button>

              <button type="button" data-action="switch-tab" data-tab="revisions" class="nav-item ${state.activeTab === 'revisions' && !state.searchQuery ? 'active' : ''}">
                <span class="flex items-center gap-2-5">${icon('RotateCw', 16)} <span>Smart Revision</span></span>
                ${dueRevisionsCount > 0 ? `<span class="badge badge-today">${dueRevisionsCount}</span>` : ''}
              </button>

              <button type="button" data-action="switch-tab" data-tab="analytics" class="nav-item ${state.activeTab === 'analytics' && !state.searchQuery ? 'active' : ''}">
                <span class="flex items-center gap-2-5">${icon('TrendingUp', 16)} <span>Study Analytics</span></span>
              </button>

              <div class="text-xs font-bold uppercase text-slate-500" style="padding:0.85rem 0.5rem 0.25rem 0.5rem; letter-spacing:0.06em;">
                Subjects
              </div>

              ${state.syllabus.map(subj => {
                const prog = getSubjectProgress(subj);
                const isActive = state.activeTab === subj.id && !state.searchQuery;
                return `
                  <button type="button" data-action="switch-tab" data-tab="${subj.id}" class="nav-item ${isActive ? 'active-subject' : ''}" data-sidebar-subj="${subj.id}">
                    <span class="flex items-center gap-2-5">
                      <span class="${isActive ? 'text-indigo-400' : 'text-slate-500'}">${icon(SUBJECT_ICON_NAMES[subj.name] || 'BookOpen', 16)}</span>
                      <span>${escapeHtml(subj.name)}</span>
                    </span>
                    <span class="sidebar-subj-prog text-xs ${prog === 100 ? 'text-emerald-400 font-bold' : 'text-slate-400'}">
                      ${prog === 100 ? icon('CheckCircle2', 15) : prog + '%'}
                    </span>
                  </button>
                `;
              }).join('')}

              <div class="text-xs font-bold uppercase text-slate-500" style="padding:0.85rem 0.5rem 0.25rem 0.5rem; letter-spacing:0.06em;">
                System
              </div>

              <button type="button" data-action="switch-tab" data-tab="settings" class="nav-item ${state.activeTab === 'settings' && !state.searchQuery ? 'active' : ''}">
                <span class="flex items-center gap-2-5">${icon('Settings', 16)} <span>Backup & Restore</span></span>
              </button>
            </nav>
          </aside>

          <!-- Main Content View -->
          <main class="main-area">
            <div class="content-container">
              ${mainContentHTML}
            </div>
          </main>

          <!-- Mobile Bottom Quick Navigation Bar -->
          <nav class="mobile-bottom-nav">
            <button type="button" data-action="switch-tab" data-tab="dashboard" class="mobile-nav-btn ${state.activeTab === 'dashboard' ? 'active' : ''}">
              ${icon('LayoutDashboard', 18)} <span>Home</span>
            </button>
            <button type="button" data-action="switch-tab" data-tab="planner" class="mobile-nav-btn ${state.activeTab === 'planner' ? 'active' : ''}">
              ${icon('Calendar', 18)} <span>Planner</span>
            </button>
            <button type="button" data-action="switch-tab" data-tab="revisions" class="mobile-nav-btn ${state.activeTab === 'revisions' ? 'active' : ''}">
              ${icon('RotateCw', 18)} <span>Revise</span>
            </button>
            <button type="button" data-action="switch-tab" data-tab="analytics" class="mobile-nav-btn ${state.activeTab === 'analytics' ? 'active' : ''}">
              ${icon('TrendingUp', 18)} <span>Stats</span>
            </button>
            <button type="button" data-action="switch-tab" data-tab="settings" class="mobile-nav-btn ${state.activeTab === 'settings' ? 'active' : ''}">
              ${icon('Settings', 18)} <span>Backup</span>
            </button>
          </nav>

          <!-- Floating Pomodoro Timer Mount -->
          <div id="pomodoro-mount">
            ${buildPomodoroHTML()}
          </div>

          <!-- Modals Mount -->
          ${buildModalsHTML()}
        </div>
      `;
    }

    /* ==========================================================================
       8. EVENT DELEGATION & INTERACTION CONTROLLERS
       ========================================================================== */
    function buildBackupPayloadObject() {
      return {
        app: "Class 11 Syllabus Tracker",
        version: "2.0",
        exportedAt: new Date().toISOString(),
        syllabus: state.syllabus,
        tasks: state.tasks,
        sessions: state.sessions
      };
    }

    function parseAndValidateBackupJSON(rawText, sourceName = 'Pasted JSON Backup') {
      try {
        const parsed = JSON.parse(rawText);
        let extractedSyllabus = null;
        let extractedTasks = [];
        let extractedSessions = [];

        if (Array.isArray(parsed)) {
          extractedSyllabus = parsed;
        } else if (parsed && typeof parsed === 'object' && Array.isArray(parsed.syllabus)) {
          extractedSyllabus = parsed.syllabus;
          extractedTasks = Array.isArray(parsed.tasks) ? parsed.tasks : [];
          extractedSessions = Array.isArray(parsed.sessions) ? parsed.sessions : [];
        } else {
          throw new Error('Invalid format. Expected a Syllabus Tracker JSON backup.');
        }

        const hasValidSubjects = extractedSyllabus.some(s => s && typeof s.name === 'string' && Array.isArray(s.topics));
        if (!hasValidSubjects) {
          throw new Error('Backup does not contain recognizable Class 11 subjects and chapters.');
        }

        const normalizedSyllabus = normalizeSyllabusData(extractedSyllabus);
        const totalTopicsCount = normalizedSyllabus.reduce((acc, s) => acc + s.topics.length, 0);

        state.pendingRestoreData = {
          sourceName,
          syllabus: normalizedSyllabus,
          tasks: extractedTasks,
          sessions: extractedSessions,
          summary: {
            subjectsCount: normalizedSyllabus.length,
            topicsCount: totalTopicsCount,
            tasksCount: extractedTasks.length,
            sessionsCount: extractedSessions.length
          }
        };
        state.rawJsonModalMode = null;
        state.statusBanner = null;
        renderApp();
      } catch (err) {
        state.statusBanner = {
          type: 'error',
          message: 'Restore validation failed: ' + (err.message || 'Invalid JSON')
        };
        state.rawJsonModalMode = null;
        renderApp();
      }
    }

    // Click Delegation
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.getAttribute('data-action');

      if (action === 'toggle-mobile-menu') {
        state.mobileMenuOpen = !state.mobileMenuOpen;
        renderApp();
      } else if (action === 'switch-tab') {
        state.activeTab = btn.getAttribute('data-tab');
        state.searchQuery = '';
        state.mobileMenuOpen = false;
        renderApp();
      } else if (action === 'clear-search') {
        state.searchQuery = '';
        renderApp();
      } else if (action === 'toggle-subtopics') {
        const tid = btn.getAttribute('data-topic-id');
        state.openSubtopics[tid] = !state.openSubtopics[tid];
        renderApp();
      } else if (action === 'toggle-revision') {
        const tid = btn.getAttribute('data-topic-id');
        state.openRevisions[tid] = !state.openRevisions[tid];
        renderApp();
      } else if (action === 'toggle-notes') {
        const tid = btn.getAttribute('data-topic-id');
        state.openNotes[tid] = !state.openNotes[tid];
        renderApp();
      } else if (action === 'toggle-subtopic-check') {
        const tid = btn.getAttribute('data-topic-id');
        const stId = btn.getAttribute('data-subtopic-id');
        const found = findTopicById(tid);
        if (!found) return;
        const updatedList = (found.topic.subtopics || []).map(st =>
          st.id === stId ? { ...st, completed: !st.completed } : st
        );
        const allDone = updatedList.length > 0 && updatedList.every(st => st.completed);
        const anyDone = updatedList.some(st => st.completed);
        const extra = {};
        if (allDone && found.topic.status !== 'Completed') extra.status = 'Completed';
        else if (!allDone && anyDone && found.topic.status === 'Not Started') extra.status = 'Learning';
        updateTopicById(tid, { subtopics: updatedList, ...extra });
      } else if (action === 'toggle-subtopic-note') {
        const stId = btn.getAttribute('data-subtopic-id');
        state.openSubtopicNotes[stId] = !state.openSubtopicNotes[stId];
        renderApp();
      } else if (action === 'start-subtopic-edit') {
        state.editingSubtopicId = btn.getAttribute('data-subtopic-id');
        state.editingSubtopicName = btn.getAttribute('data-subtopic-name') || '';
        renderApp();
      } else if (action === 'cancel-subtopic-edit') {
        state.editingSubtopicId = null;
        state.editingSubtopicName = '';
        renderApp();
      } else if (action === 'save-subtopic-edit') {
        const tid = btn.getAttribute('data-topic-id');
        const stId = btn.getAttribute('data-subtopic-id');
        const inputEl = document.getElementById(`edit-subtopic-input-${stId}`);
        const newName = (inputEl ? inputEl.value : state.editingSubtopicName).trim();
        if (!newName) return;
        const found = findTopicById(tid);
        if (!found) return;
        const updatedList = (found.topic.subtopics || []).map(st =>
          st.id === stId ? { ...st, name: newName } : st
        );
        state.editingSubtopicId = null;
        state.editingSubtopicName = '';
        updateTopicById(tid, { subtopics: updatedList });
      } else if (action === 'delete-subtopic') {
        const tid = btn.getAttribute('data-topic-id');
        const stId = btn.getAttribute('data-subtopic-id');
        const found = findTopicById(tid);
        if (!found) return;
        const updatedList = (found.topic.subtopics || []).filter(st => st.id !== stId);
        updateTopicById(tid, { subtopics: updatedList });
      } else if (action === 'mark-revised') {
        const tid = btn.getAttribute('data-topic-id');
        const days = Number(btn.getAttribute('data-days')) || 7;
        const today = getTodayDateString();
        const nextDate = addDaysToDateString(today, days);
        const found = findTopicById(tid);
        updateTopicById(tid, {
          lastRevisionDate: today,
          nextRevisionDate: nextDate,
          status: found && found.topic.status === 'Needs Revision' ? 'Completed' : (found ? found.topic.status : 'Learning')
        });
      } else if (action === 'clear-revision-date') {
        const tid = btn.getAttribute('data-topic-id');
        updateTopicById(tid, { nextRevisionDate: null });
      } else if (action === 'toggle-task') {
        const taskId = btn.getAttribute('data-task-id');
        state.tasks = state.tasks.map(t => t.id === taskId ? { ...t, completed: !t.completed } : t);
        saveStoredJSON(STORAGE_KEYS.TASKS, state.tasks);
        renderApp();
      } else if (action === 'delete-task') {
        const taskId = btn.getAttribute('data-task-id');
        state.tasks = state.tasks.filter(t => t.id !== taskId);
        saveStoredJSON(STORAGE_KEYS.TASKS, state.tasks);
        renderApp();
      } else if (action === 'start-task-edit') {
        const taskId = btn.getAttribute('data-task-id');
        const task = state.tasks.find(t => t.id === taskId);
        if (!task) return;
        state.editingTaskId = taskId;
        state.editingTaskForm = {
          title: task.title,
          targetDate: task.targetDate,
          estimatedMinutes: task.estimatedMinutes
        };
        renderApp();
      } else if (action === 'cancel-task-edit') {
        state.editingTaskId = null;
        renderApp();
      } else if (action === 'save-task-edit') {
        const taskId = btn.getAttribute('data-task-id');
        const titleEl = document.getElementById('edit-task-title');
        const dateEl = document.getElementById('edit-task-date');
        const minsEl = document.getElementById('edit-task-mins');
        const nextTitle = (titleEl ? titleEl.value : '').trim();
        if (!nextTitle) return;
        state.tasks = state.tasks.map(t =>
          t.id === taskId
            ? {
                ...t,
                title: nextTitle,
                targetDate: (dateEl && dateEl.value) || getTodayDateString(),
                estimatedMinutes: Math.max(5, Number(minsEl && minsEl.value) || 30)
              }
            : t
        );
        state.editingTaskId = null;
        saveStoredJSON(STORAGE_KEYS.TASKS, state.tasks);
        renderApp();
      } else if (action === 'pomo-minimize-toggle') {
        state.pomodoro.minimized = !state.pomodoro.minimized;
        renderPomodoroWidgetOnly();
      } else if (action === 'pomo-test-sound') {
        state.pomodoro.soundEnabled = !state.pomodoro.soundEnabled;
        if (state.pomodoro.soundEnabled) playOfflineNotificationSound();
        renderPomodoroWidgetOnly();
      } else if (action === 'pomo-toggle') {
        const p = state.pomodoro;
        if (!p.isActive) {
          p.targetEndTime = Date.now() + p.timeLeft * 1000;
          p.isActive = true;
        } else {
          if (p.targetEndTime) {
            p.timeLeft = Math.max(0, Math.ceil((p.targetEndTime - Date.now()) / 1000));
          }
          p.targetEndTime = null;
          p.isActive = false;
        }
        renderPomodoroWidgetOnly();
      } else if (action === 'pomo-reset') {
        const p = state.pomodoro;
        p.targetEndTime = null;
        p.isActive = false;
        const def = p.isBreak ? 5 * 60 : 25 * 60;
        p.timeLeft = def;
        p.sessionStartDuration = def;
        renderPomodoroWidgetOnly();
      } else if (action === 'pomo-mode') {
        const isBrk = btn.getAttribute('data-break') === 'true';
        const p = state.pomodoro;
        p.targetEndTime = null;
        p.isBreak = isBrk;
        p.isActive = false;
        const nextSec = isBrk ? 5 * 60 : 25 * 60;
        p.timeLeft = nextSec;
        p.sessionStartDuration = nextSec;
        renderPomodoroWidgetOnly();
      } else if (action === 'export-json-file') {
        try {
          const payloadStr = JSON.stringify(buildBackupPayloadObject(), null, 2);
          const fileName = `class11-syllabus-backup-${getTodayDateString()}.json`;
          const blob = new Blob([payloadStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 2000);

          state.statusBanner = {
            type: 'success',
            message: 'Backup file generated! If your Android APK viewer blocks downloads, use "Copy Raw JSON Backup" below.'
          };
          renderApp();
        } catch (err) {
          state.rawJsonModalMode = 'copy';
          state.rawJsonText = JSON.stringify(buildBackupPayloadObject(), null, 2);
          renderApp();
        }
      } else if (action === 'open-raw-copy-modal') {
        state.rawJsonModalMode = 'copy';
        state.rawJsonText = JSON.stringify(buildBackupPayloadObject(), null, 2);
        renderApp();
      } else if (action === 'open-raw-paste-modal') {
        state.rawJsonModalMode = 'paste';
        state.rawJsonText = '';
        renderApp();
      } else if (action === 'close-raw-modal') {
        state.rawJsonModalMode = null;
        renderApp();
      } else if (action === 'copy-raw-json-btn') {
        const ta = document.getElementById('raw-json-textarea');
        if (ta) {
          ta.select();
          document.execCommand('copy');
        }
        state.rawJsonModalMode = null;
        state.statusBanner = {
          type: 'success',
          message: 'Raw JSON backup copied to clipboard!'
        };
        renderApp();
      } else if (action === 'validate-raw-json-btn') {
        const ta = document.getElementById('raw-json-textarea');
        const val = ta ? ta.value.trim() : '';
        parseAndValidateBackupJSON(val, 'Pasted Raw JSON');
      } else if (action === 'cancel-restore') {
        state.pendingRestoreData = null;
        renderApp();
      } else if (action === 'confirm-restore') {
        if (!state.pendingRestoreData) return;
        state.syllabus = state.pendingRestoreData.syllabus;
        state.tasks = state.pendingRestoreData.tasks;
        state.sessions = state.pendingRestoreData.sessions;
        persistAll();
        state.pendingRestoreData = null;
        state.statusBanner = {
          type: 'success',
          message: 'Backup restored! All chapters, subtopics, notes, planner tasks, and sessions are updated.'
        };
        renderApp();
      } else if (action === 'dismiss-banner') {
        state.statusBanner = null;
        renderApp();
      }
    });

    // Change & Input Delegation (Preserving cursor focus on textareas/inputs)
    document.addEventListener('input', (e) => {
      const target = e.target;
      const action = target.getAttribute('data-action');
      if (!action) return;

      if (action === 'search-input') {
        state.searchQuery = target.value;
        const pos = target.selectionStart;
        renderApp();
        const newSearchInput = document.getElementById('global-search-input');
        if (newSearchInput) {
          newSearchInput.focus();
          newSearchInput.setSelectionRange(pos, pos);
        }
      } else if (action === 'topic-note-input') {
        const tid = target.getAttribute('data-topic-id');
        updateTopicById(tid, { notes: target.value }, false);
      } else if (action === 'subtopic-note-input') {
        const tid = target.getAttribute('data-topic-id');
        const stId = target.getAttribute('data-subtopic-id');
        const found = findTopicById(tid);
        if (!found) return;
        const updatedList = (found.topic.subtopics || []).map(st =>
          st.id === stId ? { ...st, notes: target.value } : st
        );
        updateTopicById(tid, { subtopics: updatedList }, false);
      } else if (action === 'subtopic-draft-input') {
        const tid = target.getAttribute('data-topic-id');
        state.subtopicDrafts[tid] = target.value;
      } else if (action === 'planner-form-input') {
        const field = target.getAttribute('data-field');
        state.plannerForm[field] = target.value;
      } else if (action === 'manual-session-input') {
        const field = target.getAttribute('data-field');
        state.manualSessionForm[field] = target.value;
      }
    });

    document.addEventListener('change', (e) => {
      const target = e.target;
      const action = target.getAttribute('data-action');
      if (!action) return;

      if (action === 'topic-status-change') {
        const tid = target.getAttribute('data-topic-id');
        updateTopicById(tid, { status: target.value }, true);
      } else if (action === 'set-revision-date') {
        const tid = target.getAttribute('data-topic-id');
        updateTopicById(tid, { nextRevisionDate: target.value || null }, true);
      } else if (action === 'planner-subject-change') {
        state.plannerForm.subjectId = target.value;
        state.plannerForm.topicId = '';
        renderApp();
      } else if (action === 'pomo-subject-change') {
        state.pomodoro.selectedSubjectId = target.value;
      } else if (action === 'import-json-file') {
        const file = target.files && target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          parseAndValidateBackupJSON(ev.target.result, file.name);
        };
        reader.readAsText(file);
        target.value = '';
      }
    });

    // Form Submissions
    document.addEventListener('submit', (e) => {
      const form = e.target;
      const action = form.getAttribute('data-action');
      if (!action) return;
      e.preventDefault();

      if (action === 'add-subtopic-form') {
        const tid = form.getAttribute('data-topic-id');
        const name = (state.subtopicDrafts[tid] || '').trim();
        if (!name) return;
        const found = findTopicById(tid);
        if (!found) return;
        const newSt = {
          id: `st-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
          name,
          completed: false,
          notes: ''
        };
        state.subtopicDrafts[tid] = '';
        updateTopicById(tid, { subtopics: [...(found.topic.subtopics || []), newSt] }, true);
      } else if (action === 'add-planner-task') {
        const pf = state.plannerForm;
        const trimmed = (pf.title || '').trim();
        if (!trimmed) return;
        const subj = state.syllabus.find(s => s.id === pf.subjectId) || state.syllabus[0];
        const topic = subj.topics.find(t => t.id === pf.topicId);
        const newTask = {
          id: `task-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          title: trimmed,
          subjectId: subj.id,
          subjectName: subj.name,
          topicId: topic ? topic.id : '',
          topicName: topic ? topic.name : '',
          targetDate: pf.targetDate || getTodayDateString(),
          estimatedMinutes: Math.max(5, Number(pf.estimatedMinutes) || 30),
          completed: false,
          createdAt: new Date().toISOString()
        };
        state.tasks = [newTask, ...state.tasks];
        state.plannerForm.title = '';
        saveStoredJSON(STORAGE_KEYS.TASKS, state.tasks);
        renderApp();
      } else if (action === 'log-manual-session') {
        const mf = state.manualSessionForm;
        const mins = Math.max(1, Number(mf.durationMinutes) || 25);
        const subj = state.syllabus.find(s => s.id === mf.subjectId) || state.syllabus[0];
        const newSess = {
          id: `sess-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          subjectId: subj.id,
          subjectName: subj.name,
          durationMinutes: mins,
          timestamp: new Date().toISOString(),
          date: getTodayDateString()
        };
        state.sessions = [newSess, ...state.sessions];
        saveStoredJSON(STORAGE_KEYS.SESSIONS, state.sessions);
        renderApp();
      }
    });

    // Initial Launch
    renderApp();
  </script>

  <!-- Service Worker: online updates + offline fallback -->
  <script>
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      window.addEventListener("load", async () => {
        try {
          const registration = await navigator.serviceWorker.register("./sw.js", {
            scope: "./",
            updateViaCache: "none"
          });
          // Check whether the Service Worker itself has a newer version.
          await registration.update();
          console.log("Offline support is ready.");
        } catch (error) {
          console.warn("Offline support could not be started:", error);
        }
      });
    }
  </script>

</body>
