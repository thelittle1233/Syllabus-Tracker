    function getTodayDateString() {
      const now = new Date(); const y = now.getFullYear(); const m = String(now.getMonth() + 1).padStart(2, '0'); const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function addDaysToDateString(dateStr, days) {
      const base = dateStr ? new Date(dateStr + 'T00:00:00') : new Date(); base.setDate(base.getDate() + days);
      const y = base.getFullYear(); const m = String(base.getMonth() + 1).padStart(2, '0'); const d = String(base.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatReadableDate(dateStr) {
      if (!dateStr) return 'Not set';
      try { const [y, m, d] = dateStr.split('-').map(Number); const dt = new Date(y, m - 1, d); return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return dateStr; }
    }

    function normalizeSyllabusData(rawSyllabus) {
      if (!Array.isArray(rawSyllabus)) return JSON.parse(JSON.stringify(INITIAL_SYLLABUS));
      const rawSubjectMap = new Map(rawSyllabus.map(s => [s.id || (s.name && s.name.toLowerCase()), s]));
      return INITIAL_SYLLABUS.map(initSubject => {
        const existingSubject = rawSubjectMap.get(initSubject.id) || rawSyllabus.find(s => s && s.name === initSubject.name);
        if (!existingSubject || !Array.isArray(existingSubject.topics)) return JSON.parse(JSON.stringify(initSubject));
        const existingTopicMap = new Map(existingSubject.topics.filter(Boolean).map(t => [t.id, t]));
        const mergedTopics = initSubject.topics.map(initTopic => {
          const savedTopic = existingTopicMap.get(initTopic.id);
          if (!savedTopic) return { ...initTopic, subtopics: [] };
          return { ...initTopic, ...savedTopic, status: WEIGHTS[savedTopic.status] !== undefined ? savedTopic.status : initTopic.status, notes: typeof savedTopic.notes === 'string' ? savedTopic.notes : '', subtopics: Array.isArray(savedTopic.subtopics) ? savedTopic.subtopics.map(st => ({ id: st.id || `st-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, name: String(st.name || 'Untitled Subtopic'), completed: Boolean(st.completed), notes: typeof st.notes === 'string' ? st.notes : '' })) : [], nextRevisionDate: savedTopic.nextRevisionDate || null, lastRevisionDate: savedTopic.lastRevisionDate || null };
        });
        const initTopicIds = new Set(initSubject.topics.map(t => t.id));
        const customTopics = existingSubject.topics.filter(t => t && t.id && !initTopicIds.has(t.id)).map(t => ({ id: t.id, unit: t.unit || 'Custom', name: t.name || 'Custom Topic', status: WEIGHTS[t.status] !== undefined ? t.status : 'Not Started', notes: typeof t.notes === 'string' ? t.notes : '', subtopics: Array.isArray(t.subtopics) ? t.subtopics : [], nextRevisionDate: t.nextRevisionDate || null, lastRevisionDate: t.lastRevisionDate || null }));
        return { ...initSubject, topics: [...mergedTopics, ...customTopics] };
      });
    }

    function normalizeSelectedSubjects(rawSelected) {
      const validIds = new Set(INITIAL_SYLLABUS.map(s => s.id));
      if (!Array.isArray(rawSelected) || rawSelected.length === 0) return [...DEFAULT_SELECTED_SUBJECT_IDS];
      const filtered = rawSelected.filter(id => validIds.has(id));
      return filtered.length > 0 ? filtered : [...DEFAULT_SELECTED_SUBJECT_IDS];
    }

    function getTopicProgress(topic) {
      if (Array.isArray(topic.subtopics) && topic.subtopics.length > 0) { const completedCount = topic.subtopics.filter(st => st.completed).length; return Math.round((completedCount / topic.subtopics.length) * 100); }
      return WEIGHTS[topic.status] ?? 0;
    }

    function getSubjectProgress(subject) {
      if (!subject || !Array.isArray(subject.topics) || subject.topics.length === 0) return 0;
      const totalWeight = subject.topics.length * 100;
      const currentWeight = subject.topics.reduce((acc, t) => acc + getTopicProgress(t), 0);
      return Math.round((currentWeight / totalWeight) * 100);
    }

    function getOverallProgress(syllabusList) {
      const allTopics = syllabusList.flatMap(s => s.topics);
      if (allTopics.length === 0) return 0;
      const totalWeight = allTopics.length * 100;
      const currentWeight = allTopics.reduce((acc, t) => acc + getTopicProgress(t), 0);
      return Math.round((currentWeight / totalWeight) * 100);
    }

              ${activeSyllabus.map(subject => {
                const prog = getSubjectProgress(subject); const iconName = getSubjectIconName(subject); const color = getSubjectColor(subject);
                return `<div class="card card-interactive" data-action="switch-tab" data-tab="${subject.id}"><div class="flex items-start justify-between mb-4"><div style="padding:0.65rem; background:var(--bg-800); border-radius:0.6rem; color:${color};">${icon(iconName, 22)}</div><span class="text-2xl font-bold text-slate-200">${prog}%</span></div><h3 class="text-lg font-semibold text-white mb-1">${escapeHtml(subject.name)}</h3><p class="text-xs text-slate-500 mb-3">${subject.topics.length} Chapters</p><div class="progress-track" style="height:6px;"><div class="progress-fill" style="width:${prog}%; background-color:${prog === 100 ? '#22c55e' : color};"></div></div></div>`;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function buildSubjectViewHTML(subject) {
      const prog = getSubjectProgress(subject); const color = getSubjectColor(subject);
      return `
        <div class="space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-4">
            <div><div class="flex items-center gap-2 text-indigo-400 text-xs font-bold uppercase mb-1">${icon(getSubjectIconName(subject), 16)} <span>CHSE Odisha Class 11 • ${subject.topics.length} Chapters</span></div><h1 class="text-3xl font-bold text-white">${escapeHtml(subject.name)}</h1></div>
            <div class="card flex items-center gap-4" style="padding:0.65rem 1rem;"><div><div class="text-xs font-bold uppercase text-slate-500">Progress</div><div class="text-xl font-bold text-white">${prog}%</div></div><div class="progress-track" style="width:110px; height:8px;"><div class="progress-fill" style="width:${prog}%; background-color:${prog === 100 ? '#22c55e' : color};"></div></div></div>
          </div>
          <div class="space-y-3">${subject.topics.map(topic => buildTopicCardHTML(topic)).join('')}</div>
        </div>
      `;
    }

    function buildSubjectModalHTML() {
      if (!state.subjectModalOpen) return '';
      const draftSet = new Set(state.draftSelectedSubjectIds);
      const groups = ["Core & Compulsory Subjects", "Arts & Humanities Electives", "Science & Math Electives", "Tech, Vocational & Elective Subjects", "M.I.L. & Alternative Languages"];
      
      return `
        <div class="modal-backdrop"><div class="modal-card modal-card-lg space-y-4">
          <div class="flex items-center justify-between border-b" style="padding-bottom:0.85rem; border-bottom:1px solid var(--border-800);">
            <div><div class="flex items-center gap-2 text-indigo-400 text-xs font-bold uppercase">${icon('Sliders', 14)} <span>CHSE Odisha +2 1st Year</span></div><h3 class="text-xl font-bold text-white mt-1">Choose Your Subjects</h3></div>
            <button type="button" data-action="close-subject-modal" class="btn-icon" style="border:none;">${icon('X', 20)}</button>
          </div>
          <div>
            <div class="flex items-center justify-between mb-2"><span class="text-xs font-bold uppercase text-slate-400">1-Click Quick Stream Presets</span><button type="button" data-action="select-all-subjects-draft" class="text-xs font-semibold text-indigo-400">Select All</button></div>
            <div class="grid-3">
              ${SUBJECT_PRESET_COMBOS.map(preset => `<button type="button" data-action="apply-subject-preset" data-preset-id="${preset.id}" class="card card-interactive" style="padding:0.65rem 0.8rem; text-align:left;"><div class="text-xs font-bold text-indigo-300 mb-1">${escapeHtml(preset.label)}</div><div class="text-xs text-slate-400" style="font-size:0.7rem; line-height:1.35;">${escapeHtml(preset.desc)}</div></button>`).join('')}
            </div>
          </div>
          <div class="space-y-4" style="max-height:48vh; overflow-y:auto; padding-right:0.25rem;">
            ${groups.map(groupName => {
              const groupSubjects = state.syllabus.filter(s => (SUBJECT_META[s.id] && SUBJECT_META[s.id].group) === groupName);
              if (groupSubjects.length === 0) return '';
              return `<div><div class="text-xs font-bold uppercase text-indigo-400 mb-2" style="letter-spacing:0.05em;">${escapeHtml(groupName)}</div><div class="grid-3">${groupSubjects.map(subj => {
                const isSelected = draftSet.has(subj.id); const color = getSubjectColor(subj); const iconName = getSubjectIconName(subj);
                return `<button type="button" data-action="toggle-draft-subject" data-subject-id="${subj.id}" class="subject-pick-card ${isSelected ? 'selected' : ''}"><div class="flex items-center gap-2-5 flex-1"><span style="color:${color}; display:inline-flex;">${icon(iconName, 18)}</span><div class="flex-1 truncate"><div class="text-sm font-semibold text-white truncate">${escapeHtml(subj.name)}</div><div class="text-xs text-slate-400">${subj.topics.length} Chapters</div></div></div><span style="color:${isSelected ? '#818cf8' : '#64748b'}; display:inline-flex;">${icon(isSelected ? 'CheckSquare' : 'Square', 18)}</span></button>`;
              }).join('')}</div></div>`;
            }).join('')}
          </div>
          <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t"><div class="text-xs text-slate-300">Selected: <strong class="text-indigo-300">${state.draftSelectedSubjectIds.length} Subjects</strong></div><div class="flex items-center gap-2"><button type="button" data-action="close-subject-modal" class="btn btn-secondary">Cancel</button><button type="button" data-action="save-subject-modal" class="btn btn-primary" ${state.draftSelectedSubjectIds.length === 0 ? 'disabled style="opacity:0.5;"' : ''}>${icon('Check', 16)} Save Subjects</button></div></div>
        </div></div>
      `;
    }

    function renderApp() {
      const activeSyllabus = getActiveSyllabus();
      let mainContentHTML = '';
      if (state.activeTab === 'dashboard') mainContentHTML = buildDashboardViewHTML();
      else if (state.activeTab === 'planner') mainContentHTML = `<div class="card p-4"><h1 class="text-2xl font-bold">Daily Planner</h1><p class="text-slate-400">Available in full version</p></div>`;
      else if (state.activeTab === 'revisions') mainContentHTML = `<div class="card p-4"><h1 class="text-2xl font-bold">Revisions</h1><p class="text-slate-400">Available in full version</p></div>`;
      else if (state.activeTab === 'analytics') mainContentHTML = `<div class="card p-4"><h1 class="text-2xl font-bold">Analytics</h1><p class="text-slate-400">Available in full version</p></div>`;
      else if (state.activeTab === 'settings') mainContentHTML = `<div class="card p-4"><h1 class="text-2xl font-bold">Settings</h1><p class="text-slate-400">Available in full version</p></div>`;
      else { const subject = state.syllabus.find(s => s.id === state.activeTab) || activeSyllabus[0] || state.syllabus[0]; mainContentHTML = buildSubjectViewHTML(subject); }

      const appEl = document.getElementById('app');
      appEl.innerHTML = `
        <div class="app-shell">
          <header class="mobile-header">
            <div class="flex items-center gap-2 text-indigo-400 font-bold text-base">${icon('Brain', 22)}<span class="text-white">Syllabus Tracker</span></div>
            <div class="flex items-center gap-1-5"><button type="button" data-action="open-subject-modal" class="btn-icon active-indigo">${icon('Sliders', 18)}</button><button type="button" data-action="toggle-mobile-menu" class="btn-icon">${icon(state.mobileMenuOpen ? 'X' : 'Menu', 20)}</button></div>
          </header>
          <aside class="sidebar ${state.mobileMenuOpen ? 'open' : ''}">
            <div style="padding:1.15rem; border-bottom:1px solid var(--border-800);"><div class="flex items-center justify-between"><div class="flex items-center gap-2 text-indigo-400 font-bold text-lg">${icon('Brain', 24)}<span class="text-white">Syllabus Tracker</span></div></div></div>
            <nav style="flex:1; overflow-y:auto; padding:0.75rem;" class="space-y-1">
              <button type="button" data-action="switch-tab" data-tab="dashboard" class="nav-item ${state.activeTab === 'dashboard' ? 'active' : ''}"><span class="flex items-center gap-2-5">${icon('LayoutDashboard', 16)} <span>Dashboard</span></span></button>
              <div class="flex items-center justify-between" style="padding:0.85rem 0.5rem 0.25rem 0.5rem;"><span class="text-xs font-bold uppercase text-slate-500">My Subjects (${activeSyllabus.length})</span><button type="button" data-action="open-subject-modal" class="text-xs font-semibold text-indigo-400 flex items-center gap-1">${icon('Sliders', 12)} Edit</button></div>
              ${activeSyllabus.map(subj => {
                const prog = getSubjectProgress(subj); const isActive = state.activeTab === subj.id; const color = getSubjectColor(subj);
                return `<button type="button" data-action="switch-tab" data-tab="${subj.id}" class="nav-item ${isActive ? 'active-subject' : ''}"><span class="flex items-center gap-2-5 truncate"><span style="color:${isActive ? color : 'var(--text-500)'}; display:inline-flex;">${icon(getSubjectIconName(subj), 16)}</span><span class="truncate">${escapeHtml(subj.name)}</span></span><span class="text-xs ${prog === 100 ? 'text-emerald-400 font-bold' : 'text-slate-400'}">${prog === 100 ? icon('CheckCircle2', 15) : prog + '%'}</span></button>`;
              }).join('')}
            </nav>
          </aside>
          <main class="main-area"><div class="content-container">${mainContentHTML}</div></main>
          ${buildSubjectModalHTML()}
        </div>
      `;
    }

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]'); if (!btn) return; const action = btn.getAttribute('data-action');
      if (action === 'toggle-mobile-menu') { state.mobileMenuOpen = !state.mobileMenuOpen; renderApp(); }
      else if (action === 'switch-tab') { state.activeTab = btn.getAttribute('data-tab'); state.mobileMenuOpen = false; renderApp(); }
      else if (action === 'open-subject-modal') { state.draftSelectedSubjectIds = [...state.selectedSubjectIds]; state.subjectModalOpen = true; renderApp(); }
      else if (action === 'close-subject-modal') { state.subjectModalOpen = false; renderApp(); }
      else if (action === 'toggle-draft-subject') { const sid = btn.getAttribute('data-subject-id'); if (state.draftSelectedSubjectIds.includes(sid)) { state.draftSelectedSubjectIds = state.draftSelectedSubjectIds.filter(id => id !== sid); } else { state.draftSelectedSubjectIds = [...state.draftSelectedSubjectIds, sid]; } renderApp(); }
      else if (action === 'apply-subject-preset') { const preset = SUBJECT_PRESET_COMBOS.find(p => p.id === btn.getAttribute('data-preset-id')); if (preset) { state.draftSelectedSubjectIds = [...preset.subjects]; renderApp(); } }
      else if (action === 'select-all-subjects-draft') { state.draftSelectedSubjectIds = state.syllabus.map(s => s.id); renderApp(); }
      else if (action === 'save-subject-modal') { if (state.draftSelectedSubjectIds.length === 0) return; state.selectedSubjectIds = state.syllabus.map(s => s.id).filter(id => state.draftSelectedSubjectIds.includes(id)); saveStoredJSON(STORAGE_KEYS.SELECTED_SUBJECTS, state.selectedSubjectIds); state.subjectModalOpen = false; if (!['dashboard','planner','revisions','analytics','settings'].includes(state.activeTab) && !state.selectedSubjectIds.includes(state.activeTab)) { state.activeTab = 'dashboard'; } renderApp(); }
      else if (action === 'toggle-subtopics') { const tid = btn.getAttribute('data-topic-id'); state.openSubtopics[tid] = !state.openSubtopics[tid]; renderApp(); }
      else if (action === 'toggle-revision') { const tid = btn.getAttribute('data-topic-id'); state.openRevisions[tid] = !state.openRevisions[tid]; renderApp(); }
      else if (action === 'toggle-notes') { const tid = btn.getAttribute('data-topic-id'); state.openNotes[tid] = !state.openNotes[tid]; renderApp(); }
    });

    document.addEventListener('change', (e) => {
      const target = e.target; const action = target.getAttribute('data-action'); if (!action) return;
      if (action === 'topic-status-change') { updateTopicById(target.getAttribute('data-topic-id'), { status: target.value }, true); }
    });

    renderApp();
  </script>
</body>
</html>
